<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — PlusOne Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:        #08080a;
    --surface:    #0f0f14;
    --rule:       rgba(255, 255, 255, 0.06);
    --rule-hi:    rgba(255, 255, 255, 0.12);
    --gold:       #d4af37;
    --gold-dim:   #aa842c;
    --text-1:     #f4f4f6;
    --text-2:     #a1a1aa;
    --text-3:     #52525b;
    --serif:      'Cormorant Garamond', Georgia, serif;
    --sans:       'Plus Jakarta Sans', system-ui, sans-serif;
    --r-sm:       8px;
    --r-lg:       24px;
  }

  body {
    background: var(--ink);
    color: var(--text-1);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle 600px at 50% -20%, rgba(212, 175, 55, 0.05), transparent);
    pointer-events: none;
    z-index: 0;
  }

  /* ── NAVBAR ── */
  nav {
    padding: 24px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 0.5px solid var(--rule);
    position: relative;
    z-index: 10;
    background: rgba(8, 8, 10, 0.8);
    backdrop-filter: blur(12px);
  }

  .nav-logo {
    font-family: var(--serif);
    font-size: 24px;
    color: var(--text-1);
    text-decoration: none;
  }
  .nav-logo span { color: var(--gold); font-style: italic; }

  .nav-right { display: flex; align-items: center; gap: 24px; }
  .welcome-text { font-size: 14px; color: var(--text-2); }
  .welcome-text span { color: var(--gold); }
  
  .btn-logout {
    font-size: 12px;
    color: var(--text-2);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    background: none;
    border: 0.5px solid var(--rule-hi);
    padding: 8px 16px;
    border-radius: var(--r-sm);
    transition: all 0.2s;
  }
  .btn-logout:hover { color: var(--text-1); border-color: var(--text-1); }

  /* ── MAIN DASHBOARD LAYOUT ── */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 6%;
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
  }

  .section-title {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 300;
    margin-bottom: 32px;
    color: var(--text-1);
  }
  .section-title em { color: var(--gold); font-style: italic; }

  /* ── BOOKING FORM UI ── */
  .booking-card {
    background: rgba(255, 255, 255, 0.02);
    border: 0.5px solid var(--rule-hi);
    border-radius: var(--r-lg);
    padding: 40px;
    backdrop-filter: blur(10px);
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .form-group { margin-bottom: 24px; }
  
  .form-label {
    display: block;
    font-size: 11px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .form-input, .form-select {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 0.5px solid var(--rule-hi);
    border-radius: var(--r-sm);
    padding: 14px;
    color: var(--text-1);
    font-family: var(--sans);
    font-size: 14px;
    transition: all 0.3s;
  }
  .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold-dim); }

  .btn-submit {
    width: 100%;
    padding: 16px;
    background: var(--gold);
    color: #000;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-submit:hover { background: #f1cc5b; transform: translateY(-2px); }

  /* ── REQUESTS & HISTORY UI ── */
  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .status-pending { background: rgba(255, 193, 7, 0.1); border: 0.5px solid rgba(255, 193, 7, 0.3); color: #ffc107; }
  .status-assigned { background: rgba(76, 175, 80, 0.1); border: 0.5px solid rgba(76, 175, 80, 0.3); color: #4caf50; }
  .status-completed { background: rgba(212, 175, 55, 0.1); border: 0.5px solid rgba(212, 175, 55, 0.3); color: var(--gold); }

  .request-card {
    background: rgba(255, 255, 255, 0.01);
    border: 0.5px solid var(--rule);
    border-radius: var(--r-sm);
    padding: 24px;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }
  .request-card:hover { border-color: var(--rule-hi); }

  .req-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .req-date { font-family: var(--serif); font-size: 20px; color: var(--text-1); }
  .req-details { font-size: 13px; color: var(--text-2); margin-bottom: 16px; line-height: 1.6; }
  
  .companion-box {
    background: rgba(212, 175, 55, 0.04);
    border: 0.5px solid var(--gold-pale);
    border-radius: 4px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .comp-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--rule-hi); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .comp-info p { font-size: 13px; color: var(--text-1); margin: 0; }
  .comp-info span { font-size: 11px; color: var(--gold); }

  .empty-state { font-size: 14px; color: var(--text-3); font-style: italic; text-align: center; padding: 40px 0; border: 0.5px dashed var(--rule); border-radius: var(--r-sm); }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Plus<span>One</span></a>
  <div class="nav-right">
    <div class="welcome-text">Welcome, <span id="userNameDisplay">Member</span></div>
    <button onclick="logout()" class="btn-logout">Logout</button>
  </div>
</nav>

<main>
  <div>
    <h2 class="section-title">Concierge <em>Request.</em></h2>
    <div class="booking-card">
      <form id="bookingForm">
        <div class="form-row">
          <div>
            <label class="form-label">Date</label>
            <input type="date" id="b_date" class="form-input" required>
          </div>
          <div>
            <label class="form-label">Time</label>
            <input type="time" id="b_time" class="form-input" required>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Duration</label>
          <select id="b_duration" class="form-select" required>
            <option value="hourly">Hourly (₹259)</option>
            <option value="half_day">Half Day (₹399)</option>
            <option value="full_day">Full Day (₹699)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Public Location</label>
          <input type="text" id="b_location" class="form-input" placeholder="e.g. Summit Building" required>
        </div>

        <div class="form-group">
          <label class="form-label">Promo Code (Optional)</label>
          <input type="text" id="b_promo" class="form-input" placeholder="Enter code">
        </div>

        <button type="submit" id="submitBookingBtn" class="btn-submit">Submit Secure Request →</button>
      </form>
    </div>
  </div>

  <div>
    <h2 class="section-title">Active <em>Engagements.</em></h2>
    <div id="activeBookingsContainer">
      <div class="empty-state">Loading your active requests...</div>
    </div>

    <h2 class="section-title" style="margin-top: 60px;">Past <em>History.</em></h2>
    <div id="historyBookingsContainer">
      </div>
  </div>
</main>

<script>

    // dashboard.html ke <script> mein sabse upar yeh daalo:
const userToken = localStorage.getItem('userToken');
if (!userToken) {
    // Agar token nahi hai, toh user ko bhaga do login page par
    window.location.href = 'login.html';
}
  // 1. AUTHENTICATION CHECK
  const token = localStorage.getItem('userToken');
  if (!token) {
      window.location.href = 'login.html'; // Agar token nahi hai toh bhaga do
  }

  // Display User Name (Agar localStorage me save kiya hai)
  const userEmail = localStorage.getItem('userEmail');
  if(userEmail) { 
    document.getElementById('userNameDisplay').textContent = userEmail.split('@'); 
    }

  // Logout Function
  function logout() {
      localStorage.removeItem('userToken');
      localStorage.removeItem('userEmail');
      window.location.href = 'login.html';
  }

  // 2. FETCH DASHBOARD DATA (API Call)
  function fetchDashboardData() {
      fetch('http://localhost:8000/api/my-bookings', {
          method: 'GET',
          headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/json'
          }
      })
      .then(res => res.json())
      .then(data => {
          if(data.success) {
              renderActiveBookings(data.active_bookings);
              renderHistoryBookings(data.history);
          }
      })
      .catch(err => console.error("Error fetching data: ", err));
  }

  // 3. RENDER ACTIVE BOOKINGS
  function renderActiveBookings(bookings) {
      const container = document.getElementById('activeBookingsContainer');
      if(bookings.length === 0) {
          container.innerHTML = '<div class="empty-state">No active requests at the moment.</div>';
          return;
      }

      let html = '';
      bookings.forEach(b => {
          // Status Logic
          let statusHtml = '';
          let companionHtml = '';

          if (b.status === 'pending') {
              statusHtml = '<span class="status-badge status-pending">Pending Review</span>';
              companionHtml = `<p style="font-size:12px; color:var(--text-3); margin-top:12px;">We are matching your vibe with verified profiles.</p>`;
          } else {
              statusHtml = '<span class="status-badge status-assigned">Companion Assigned</span>';
              companionHtml = `
                  <div class="companion-box">
                      <div class="comp-avatar">✦</div>
                      <div class="comp-info">
                          <p>${b.companion ? b.companion.full_name : 'Verified PlusOne'}</p>
                          <span>ID: V-${b.companion_id || 'XXX'}</span>
                      </div>
                  </div>
              `;
          }

          html += `
              <div class="request-card">
                  <div class="req-header">
                      <div class="req-date">${formatDate(b.meetup_date)} <span style="font-size:14px; color:var(--text-2); font-family:var(--sans);">@ ${b.meetup_time}</span></div>
                      ${statusHtml}
                  </div>
                  <div class="req-details">
                      📍 ${b.location} &nbsp;&nbsp; | &nbsp;&nbsp; ⏱ ${b.duration_type.replace('_', ' ')}
                  </div>
                  ${companionHtml}
              </div>
          `;
      });
      container.innerHTML = html;
  }

  // 4. RENDER HISTORY BOOKINGS
  function renderHistoryBookings(bookings) {
      const container = document.getElementById('historyBookingsContainer');
      if(bookings.length === 0) {
          container.innerHTML = '<div class="empty-state">Your past engagements will appear here.</div>';
          return;
      }

      let html = '';
      bookings.forEach(b => {
          html += `
              <div class="request-card" style="opacity: 0.6;">
                  <div class="req-header">
                      <div class="req-date">${formatDate(b.meetup_date)}</div>
                      <span class="status-badge status-completed">Completed</span>
                  </div>
                  <div class="req-details" style="margin-bottom:0;">📍 ${b.location}</div>
              </div>
          `;
      });
      container.innerHTML = html;
  }

  // Helper: Format Date
  function formatDate(dateStr) {
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      return new Date(dateStr).toLocaleDateString('en-GB', options);
  }

  // 5. SUBMIT NEW BOOKING
  document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBookingBtn');
      btn.textContent = 'Processing...';

      const payload = {
          date: document.getElementById('b_date').value,
          time: document.getElementById('b_time').value,
          duration: document.getElementById('b_duration').value,
          public_location: document.getElementById('b_location').value,
          promo_code: document.getElementById('b_promo').value
      };

      fetch('http://localhost:8000/api/create-booking', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'Authorization': `Bearer ${token}` // IMPORTANT: Ye btayega ki kis user ne request ki
          },
          body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
          btn.textContent = 'Submit Secure Request →';
          if(data.success) {
              alert('Booking request received successfully!');
              document.getElementById('bookingForm').reset();
              fetchDashboardData(); // Refresh lists immediately
          } else {
              alert('Error: ' + data.message);
          }
      })
      .catch(err => {
          btn.textContent = 'Submit Secure Request →';
          alert('Server Error. Check terminal logs.');
      });
  });

  // INITIAL LOAD
  window.addEventListener('DOMContentLoaded', fetchDashboardData);
</script>

</body>
</html>
