<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — PlusOne Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:        #08080a;
    --surface:    #0f0f14;
    --rule:       rgba(255, 255, 255, 0.06);
    --rule-hi:    rgba(255, 255, 255, 0.12);
    --gold:       #d4af37;
    --gold-dim:   #aa842c;
    --text-1:     #f4f4f6;
    --text-2:     #a1a1aa;
    --text-3:     #52525b;
    --serif:      'Cormorant Garamond', Georgia, serif;
    --sans:       'Plus Jakarta Sans', system-ui, sans-serif;
    --r-sm:       8px;
    --r-lg:       24px;
  }

  body {
    background: var(--ink);
    color: var(--text-1);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle 600px at 50% -20%, rgba(212, 175, 55, 0.05), transparent);
    pointer-events: none;
    z-index: 0;
  }

  /* ── NAVBAR ── */
  nav {
    padding: 24px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 0.5px solid var(--rule);
    position: relative;
    z-index: 10;
    background: rgba(8, 8, 10, 0.8);
    backdrop-filter: blur(12px);
  }

  .nav-logo {
    font-family: var(--serif);
    font-size: 24px;
    color: var(--text-1);
    text-decoration: none;
  }
  .nav-logo span { color: var(--gold); font-style: italic; }

  .nav-right { display: flex; align-items: center; gap: 24px; }
  .welcome-text { font-size: 14px; color: var(--text-2); }
  .welcome-text span { color: var(--gold); }
  
  .btn-logout {
    font-size: 12px;
    color: var(--text-2);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    background: none;
    border: 0.5px solid var(--rule-hi);
    padding: 8px 16px;
    border-radius: var(--r-sm);
    transition: all 0.2s;
  }
  .btn-logout:hover { color: var(--text-1); border-color: var(--text-1); }

  /* ── MAIN DASHBOARD LAYOUT ── */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 6%;
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
  }

  .section-title {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 300;
    margin-bottom: 32px;
    color: var(--text-1);
  }
  .section-title em { color: var(--gold); font-style: italic; }

  /* ── BOOKING FORM UI ── */
  .booking-card {
    background: rgba(255, 255, 255, 0.02);
    border: 0.5px solid var(--rule-hi);
    border-radius: var(--r-lg);
    padding: 40px;
    backdrop-filter: blur(10px);
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .form-group { margin-bottom: 24px; }
  
  .form-label {
    display: block;
    font-size: 11px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .form-input, .form-select {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 0.5px solid var(--rule-hi);
    border-radius: var(--r-sm);
    padding: 14px;
    color: var(--text-1);
    font-family: var(--sans);
    font-size: 14px;
    transition: all 0.3s;
  }
  .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold-dim); }

  .btn-submit {
    width: 100%;
    padding: 16px;
    background: var(--gold);
    color: #000;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-submit:hover { background: #f1cc5b; transform: translateY(-2px); }

  /* ── REQUESTS & HISTORY UI ── */
  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .status-pending { background: rgba(255, 193, 7, 0.1); border: 0.5px solid rgba(255, 193, 7, 0.3); color: #ffc107; }
  .status-assigned { background: rgba(76, 175, 80, 0.1); border: 0.5px solid rgba(76, 175, 80, 0.3); color: #4caf50; }
  .status-completed { background: rgba(212, 175, 55, 0.1); border: 0.5px solid rgba(212, 175, 55, 0.3); color: var(--gold); }

  .request-card {
    background: rgba(255, 255, 255, 0.01);
    border: 0.5px solid var(--rule);
    border-radius: var(--r-sm);
    padding: 24px;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }
  .request-card:hover { border-color: var(--rule-hi); }

  .req-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .req-date { font-family: var(--serif); font-size: 20px; color: var(--text-1); }
  .req-details { font-size: 13px; color: var(--text-2); margin-bottom: 16px; line-height: 1.6; }
  
  .companion-box {
    background: rgba(212, 175, 55, 0.04);
    border: 0.5px solid var(--gold-pale);
    border-radius: 4px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .comp-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--rule-hi); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .comp-info p { font-size: 13px; color: var(--text-1); margin: 0; }
  .comp-info span { font-size: 11px; color: var(--gold); }

  .flashcards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-top: 18px;
  }
  .flashcard {
    background: rgba(255,255,255,0.04);
    border: 0.5px solid var(--rule);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 320px;
  }
  .fc-avatar {
    height: 210px;
    overflow: hidden;
    background: var(--rule);
  }
  .fc-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .fc-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .fc-name {
    font-size: 16px;
    color: var(--text-1);
    font-weight: 600;
    margin: 0;
  }
  .fc-age {
    font-size: 13px;
    color: var(--text-2);
  }
  .fc-action {
    margin-top: auto;
  }
  .btn-select-profile {
    width: 100%;
    padding: 12px 14px;
    background: var(--gold);
    border: none;
    color: #000;
    font-size: 13px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .btn-select-profile:hover {
    background: #f1cc5b;
    transform: translateY(-1px);
  }

  .empty-state { font-size: 14px; color: var(--text-3); font-style: italic; text-align: center; padding: 40px 0; border: 0.5px dashed var(--rule); border-radius: var(--r-sm); }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Plus<span>One</span></a>
  <div class="nav-right">
    <div class="welcome-text">Welcome, <span id="userNameDisplay">Member</span></div>
    <button onclick="logout()" class="btn-logout">Logout</button>
  </div>
</nav>

<main>
  <div>
    <h2 class="section-title">Concierge <em>Request.</em></h2>
    <div class="booking-card">
      <form id="bookingForm">
        <div class="form-row">
          <div>
            <label class="form-label">Date</label>
            <input type="date" id="b_date" class="form-input" required>
          </div>
          <div>
            <label class="form-label">Time</label>
            <input type="time" id="b_time" class="form-input" required>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Duration</label>
          <select id="b_duration" class="form-select" required>
            <option value="hourly">Hourly (₹259)</option>
            <option value="half_day">Half Day (₹399)</option>
            <option value="full_day">Full Day (₹699)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Public Location</label>
          <input type="text" id="b_location" class="form-input" placeholder="e.g. Summit Building" required>
        </div>

        <div class="form-group">
          <label class="form-label">Promo Code (Optional)</label>
          <input type="text" id="b_promo" class="form-input" placeholder="Enter code">
        </div>

        <button type="submit" id="submitBookingBtn" class="btn-submit">Submit Secure Request →</button>
      </form>
    </div>
  </div>

  <div>
    <h2 class="section-title">Active <em>Engagements.</em></h2>
    <div id="activeBookingsContainer">
      <div class="empty-state">Loading your active requests...</div>
    </div>

    <h2 class="section-title" style="margin-top: 60px;">Past <em>History.</em></h2>
    <div id="historyBookingsContainer">
      </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://tpqhjkpzdecbfjuquamv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xpm51YdviIKRoEzhewYzXg_07wz6Bfl';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentUser = null;

  async function requireFemaleSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const localRole = localStorage.getItem('userRole');
    const localEmail = localStorage.getItem('userEmail');
    const localId = localStorage.getItem('userId');
    const localName = localStorage.getItem('userName');

    if (!session && localRole === 'female' && localEmail) {
      currentUser = { id: localId, email: localEmail, isClientRecord: true };
      document.getElementById('userNameDisplay').textContent = localName || localEmail.split('@')[0];
      return currentUser;
    }

    if (!session) {
      window.location.href = 'login.html';
      return null;
    }

    const role = localStorage.getItem('userRole') || session.user.user_metadata?.role || 'female';
    if (role === 'companion') {
      window.location.href = 'companion-dashboard.html';
      return null;
    }

    currentUser = session.user;
    localStorage.setItem('userToken', session.access_token);
    localStorage.setItem('userEmail', session.user.email);
    localStorage.setItem('userRole', 'female');
    localStorage.setItem('userId', session.user.id);
    document.getElementById('userNameDisplay').textContent = session.user.email.split('@')[0];
    return session.user;
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    localStorage.clear();
    window.location.href = 'login.html';
  }

  async function fetchDashboardData() {
    const user = currentUser || await requireFemaleSession();
    if (!user) return;

    const activeContainer = document.getElementById('activeBookingsContainer');
    const historyContainer = document.getElementById('historyBookingsContainer');
    activeContainer.innerHTML = '<div class="empty-state">Loading your active requests...</div>';
    historyContainer.innerHTML = '<div class="empty-state">Past engagements will appear here.</div>';

    const [{ data: bookingData, error: bookingError }, { data: companionData, error: companionError }] = await Promise.all([
      supabaseClient
        .from('bookings')
        .select('*')
        .eq('client_email', user.email)
        .order('meetup_date', { ascending: false }),
      supabaseClient
        .from('companions')
        .select('id, full_name, age, profile_picture_url')
        .eq('status', 'approved')
    ]);

    if (bookingError) {
      activeContainer.innerHTML = `<div class="empty-state">${bookingError.message}</div>`;
      return;
    }
    if (companionError) {
      console.error('Companion fetch error:', companionError);
    }

    const bookings = bookingData || [];
    const approvedCompanions = companionData || [];
    const active = bookings.filter(b => !['completed', 'cancelled'].includes((b.status || 'pending').toLowerCase()));
    const history = bookings.filter(b => ['completed', 'cancelled'].includes((b.status || '').toLowerCase()));
    renderActiveBookings(active, approvedCompanions);
    renderHistoryBookings(history);
  }

  function renderActiveBookings(bookings, approvedCompanions) {
    const container = document.getElementById('activeBookingsContainer');
    if (bookings.length === 0) {
      container.innerHTML = '<div class="empty-state">No active requests at the moment.</div>';
      return;
    }

    let html = '';
    bookings.forEach(b => {
      const status = (b.status || 'pending').toLowerCase();
      let statusHtml = '';
      let companionHtml = '';

      if (status === 'pending') {
        statusHtml = '<span class="status-badge status-pending">Pending Review</span>';
        companionHtml = renderCompanionFlashcardGrid(approvedCompanions, b.id);
      } else {
        statusHtml = '<span class="status-badge status-assigned">Companion Assigned</span>';
        const assignedCompanion = approvedCompanions.find(c => c.id === b.companion_id);
        if (assignedCompanion) {
          companionHtml = `
            <div class="companion-box">
              <div class="comp-avatar">
                <img src="${assignedCompanion.profile_picture_url || 'https://via.placeholder.com/32'}" alt="${assignedCompanion.full_name}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">
              </div>
              <div class="comp-info">
                <p>${assignedCompanion.full_name}</p>
                <span>Age ${assignedCompanion.age || 'N/A'}</span>
              </div>
            </div>
          `;
        } else {
          companionHtml = `
            <div class="companion-box">
              <div class="comp-avatar">*</div>
              <div class="comp-info">
                <p>Assigned companion</p>
                <span>ID: V-${b.companion_id || 'XXX'}</span>
              </div>
            </div>
          `;
        }
      }

      html += `
        <div class="request-card">
          <div class="req-header">
            <div class="req-date">${formatDate(b.meetup_date)} <span style="font-size:14px; color:var(--text-2); font-family:var(--sans);">@ ${b.meetup_time || ''}</span></div>
            ${statusHtml}
          </div>
          <div class="req-details">
            Location: ${b.location || 'To be confirmed'} &nbsp;&nbsp; | &nbsp;&nbsp; Duration: ${(b.duration_type || '').replace('_', ' ')}
          </div>
          ${companionHtml}
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function renderCompanionFlashcardGrid(companions, bookingId) {
    if (!companions || companions.length === 0) {
      return '<div class="empty-state">No approved profiles are available yet. Please check again soon.</div>';
    }

    return `
      <div class="flashcards-grid">
        ${companions.map(companion => `
          <div class="flashcard">
            <div class="fc-avatar">
              <img src="${companion.profile_picture_url || 'https://via.placeholder.com/300x300?text=No+Photo'}" alt="${companion.full_name}">
            </div>
            <div class="fc-body">
              <h3 class="fc-name">${companion.full_name}</h3>
              <div class="fc-age">Age ${companion.age || 'N/A'}</div>
              <div class="fc-action">
                <button class="btn-select-profile" id="assign-btn-${bookingId}-${companion.id}" onclick="assignCompanion('${bookingId}', '${companion.id}', '${companion.full_name.replace(/'/g, "\\'")}')">Select Profile</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderHistoryBookings(bookings) {
    const container = document.getElementById('historyBookingsContainer');
    if(bookings.length === 0) {
      container.innerHTML = '<div class="empty-state">Your past engagements will appear here.</div>';
      return;
    }

    container.innerHTML = bookings.map(b => `
      <div class="request-card" style="opacity: 0.6;">
        <div class="req-header">
          <div class="req-date">${formatDate(b.meetup_date)}</div>
          <span class="status-badge status-completed">${b.status || 'Completed'}</span>
        </div>
        <div class="req-details" style="margin-bottom:0;">Location: ${b.location || 'Completed outing'}</div>
      </div>
    `).join('');
  }

  function formatDate(dateStr) {
    if (!dateStr) return 'Date pending';
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    return new Date(dateStr).toLocaleDateString('en-GB', options);
  }

  async function assignCompanion(bookingId, companionId, companionName) {
    const button = document.getElementById(`assign-btn-${bookingId}-${companionId}`);
    if (button) {
      button.disabled = true;
      button.textContent = 'Assigning...';
    }

    try {
      const { error } = await supabaseClient
        .from('bookings')
        .update({ companion_id: companionId, status: 'assigned' })
        .eq('id', bookingId);

      if (error) throw error;
      alert(`Companion ${companionName} has been assigned to your booking.`);
      await fetchDashboardData();
    } catch (err) {
      alert(err.message || 'Could not assign companion. Please try again.');
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = 'Select Profile';
      }
    }
  }

  document.getElementById('bookingForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBookingBtn');
    const originalText = 'Submit Secure Request →';
    btn.disabled = true;
    btn.textContent = 'Processing...';

    try {
      const user = currentUser || await requireFemaleSession();
      if (!user) return;

      const payload = {
        client_email: user.email,
        meetup_date: document.getElementById('b_date').value,
        meetup_time: document.getElementById('b_time').value,
        duration_type: document.getElementById('b_duration').value,
        location: document.getElementById('b_location').value,
        promo_code: document.getElementById('b_promo').value || null,
        status: 'pending'
      };

      const { error } = await supabaseClient.from('bookings').insert(payload);
      if (error) throw error;

      alert('Booking request received successfully!');
      document.getElementById('bookingForm').reset();
      await fetchDashboardData();
    } catch (err) {
      alert(err.message || 'Could not submit booking. Please try again.');
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });

  window.addEventListener('DOMContentLoaded', async () => {
    await requireFemaleSession();
    await fetchDashboardData();
  });
</script>

</body>
</html>
