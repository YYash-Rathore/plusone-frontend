<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PlusOne Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #08080a;
      --surface: #0f0f14;
      --rule: rgba(255, 255, 255, 0.06);
      --rule-hi: rgba(255, 255, 255, 0.12);
      --gold: #d4af37;
      --gold-dim: #aa842c;
      --text-1: #f4f4f6;
      --text-2: #a1a1aa;
      --text-3: #52525b;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --r-sm: 8px;
      --r-lg: 24px;
    }

    body {
      background: var(--ink);
      color: var(--text-1);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── AMBIENT GLOW ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle 600px at 50% 50%, rgba(212, 175, 55, 0.03), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* ── SIMPLE NAVBAR ── */
    nav {
      padding: 24px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid var(--rule);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(8, 8, 10, 0.92);
      backdrop-filter: blur(16px);
      z-index: 50;
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 24px;
      color: var(--text-1);
      text-decoration: none;
    }

    .nav-logo span {
      color: var(--gold);
      font-style: italic;
    }

    .back-link {
      font-size: 13px;
      color: var(--text-2);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--gold);
    }

    /* ── AUTH BOX ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 6% 40px;
      position: relative;
      z-index: 1;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.02);
      border: 0.5px solid var(--rule-hi);
      border-radius: var(--r-lg);
      padding: 50px 50px;
      width: 100%;
      max-width: 480px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    /* ── TAB SWITCHER ── */
    .tab-container {
      display: flex;
      background: rgba(255, 255, 255, 0.02);
      border: 0.5px solid var(--rule-hi);
      border-radius: var(--r-sm);
      padding: 6px;
      margin-bottom: 40px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      color: var(--text-2);
      border: none;
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-btn.active {
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold);
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.05);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-1);
      background: rgba(255, 255, 255, 0.05);
    }

    .auth-title {
      font-family: var(--serif);
      font-size: 36px;
      font-weight: 300;
      margin-bottom: 8px;
      text-align: center;
      transition: opacity 0.3s;
    }

    .auth-title em {
      color: var(--gold);
      font-style: italic;
    }

    .auth-sub {
      font-size: 14px;
      color: var(--text-2);
      text-align: center;
      margin-bottom: 40px;
      transition: opacity 0.3s;
    }

    /* ── FORM ELEMENTS ── */
    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 0.5px solid var(--rule-hi);
      border-radius: var(--r-sm);
      padding: 16px;
      color: var(--text-1);
      font-family: var(--sans);
      font-size: 15px;
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--gold-dim);
      background: rgba(212, 175, 55, 0.02);
    }

    .btn-submit {
      width: 100%;
      padding: 18px;
      background: var(--gold);
      color: #000;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: var(--r-sm);
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }

    .btn-submit:hover {
      background: #f1cc5b;
      transform: translateY(-2px);
    }

    .forgot-link {
      display: inline-block;
      color: var(--gold);
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 18px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .form-secondary {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-back {
      width: 100%;
      padding: 14px 16px;
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      background: transparent;
      color: var(--text-1);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .error-message {
      color: #ff4d4d;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      display: none;
    }

    @media (max-width: 1024px) {
      nav {
        padding: 20px 28px;
      }

      .auth-card {
        padding: 40px 32px;
        max-width: 430px;
      }

      .tab-container {
        margin-bottom: 32px;
      }
    }

    @media (max-width: 768px) {

      html,
      body {
        overflow-x: hidden;
      }

      body {
        font-size: 14px;
      }

      nav {
        padding: 16px 18px;
      }

      .auth-card {
        padding: 32px 22px;
        margin-top: 48px;
      }

      .auth-title {
        font-size: clamp(30px, 7vw, 34px);
      }

      .auth-sub {
        font-size: 14px;
      }

      .form-input {
        padding: 14px;
      }

      .btn-submit {
        padding: 14px;
        font-size: 12px;
      }

      .form-group {
        margin-bottom: 18px;
      }
    }

    @media (max-width: 480px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .auth-card {
        width: 100%;
        margin-top: 56px;
      }

      .tab-container {
        flex-direction: column;
      }

      .tab-btn {
        font-size: 11px;
        padding: 10px;
      }
    }

    #resetForm {
      display: none;
    }

    .reset-heading {
      font-family: var(--serif);
      font-size: 24px;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .reset-note {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 24px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="nav-logo">Plus<span>One</span></a>
    <a href="index.html" class="back-link">← Back to Home</a>
  </nav>

  <main>
    <div class="auth-card">

      <div class="tab-container">
        <button class="tab-btn active" id="tab-female" onclick="switchTab('female')">Female User</button>
        <button class="tab-btn" id="tab-companion" onclick="switchTab('companion')">Companion Professional</button>
      </div>

      <h1 class="auth-title" id="auth-title">Welcome <em>Back</em>.</h1>
      <p class="auth-sub" id="auth-sub">Enter your credentials to access your secure dashboard.</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" required placeholder="you@example.com">
        </div>

        <div class="form-group" id="otp-group" style="display: none;">
          <label class="form-label">Enter OTP</label>
          <input type="text" id="otpCode" class="form-input" placeholder="- - - - - - - -"
            style="letter-spacing: 0.5em; text-align: center;" maxlength="8">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Send OTP →</button>
        <p id="errorMsg" class="error-message">Invalid credentials. Please try again.</p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://tpqhjkpzdecbfjuquamv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_xpm51YdviIKRoEzhewYzXg_07wz6Bfl';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentLoginType = 'female';

    function switchTab(type) {
      currentLoginType = type;
      document.getElementById('tab-female').classList.remove('active');
      document.getElementById('tab-companion').classList.remove('active');
      document.getElementById('tab-' + type).classList.add('active');

      const title = document.getElementById('auth-title');
      const sub = document.getElementById('auth-sub');

      if (type === 'female') {
        title.innerHTML = 'Welcome <em>Back</em>.';
        sub.innerText = 'Enter your credentials to access your secure dashboard.';
      } else {
        title.innerHTML = 'Companion <em>Portal</em>.';
        sub.innerText = 'Login to view your application status and bookings.';
      }
    }

    async function sendOTP(email) {
      const { error } = await supabaseClient.auth.signInWithOtp({
        email: email,
        options: { shouldCreateUser: true }
      });
      if (error) throw error;
    }

    async function verifyOTP(email, otp) {
      const { data, error } = await supabaseClient.auth.verifyOtp({
        email: email,
        token: otp,
        type: 'email'
      });
      if (error) return { valid: false, error: error.message };
      return { valid: true, user: data.user, session: data.session };
    }

    let isOtpSent = false;

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      if (!isOtpSent) {
        submitBtn.textContent = 'Sending OTP...';
        try {
          await sendOTP(email);
          isOtpSent = true;
          document.getElementById('otp-group').style.display = 'block';
          submitBtn.textContent = 'Verify OTP →';
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
          document.getElementById('email').readOnly = true;
        } catch (error) {
          errorMsg.style.display = 'block';
          errorMsg.textContent = error.message || 'Could not send OTP. Please try again.';
          submitBtn.textContent = 'Send OTP →';
          submitBtn.style.opacity = '1';
          submitBtn.disabled = false;
        }
      } else {
        submitBtn.textContent = 'Verifying...';
        const otp = document.getElementById('otpCode').value.trim();
        if (!otp) {
          errorMsg.style.display = 'block';
          errorMsg.textContent = 'Please enter the OTP.';
          submitBtn.textContent = 'Verify OTP →';
          submitBtn.style.opacity = '1';
          submitBtn.disabled = false;
          return;
        }

        try {
          const verifyRes = await verifyOTP(email, otp);
          if (!verifyRes.valid) throw new Error(verifyRes.error);

          if (currentLoginType === 'female') {
            const { data, error: dbError } = await supabaseClient
              .from('clients')
              .select('id, name, email')
              .eq('email', email)
              .maybeSingle();
            if (dbError || !data) throw new Error('Account not found in clients database.');

            localStorage.setItem('userToken', verifyRes.session.access_token);
            localStorage.setItem('userEmail', data.email);
            localStorage.setItem('userRole', 'female');
            localStorage.setItem('userId', String(data.id));
            localStorage.setItem('userName', data.name);
            window.location.href = 'dashboard.html';
          } else {
            const { data, error: dbError } = await supabaseClient
              .from('companions')
              .select('id, full_name, email, status')
              .eq('email', email)
              .maybeSingle();
            if (dbError || !data) throw new Error('Account not found in companions database.');

            localStorage.setItem('userToken', verifyRes.session.access_token);
            localStorage.setItem('userEmail', data.email);
            localStorage.setItem('userRole', 'companion');
            localStorage.setItem('userId', String(data.id));
            localStorage.setItem('userName', data.full_name);
            localStorage.setItem('companionStatus', data.status || 'pending');
            window.location.href = 'companion-dashboard.html';
          }
        } catch (error) {
          console.error('Login error:', error);
          errorMsg.style.display = 'block';
          errorMsg.textContent = error.message || 'Invalid OTP. Please try again.';
          submitBtn.textContent = 'Verify OTP →';
          submitBtn.style.opacity = '1';
          submitBtn.disabled = false;
        }
      }
    });

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const role = localStorage.getItem('userRole') || session?.user?.user_metadata?.role;
      const localToken = localStorage.getItem('userToken');

      if (localToken && (role === 'female' || role === 'companion')) {
        window.location.href = role === 'companion' ? 'companion-dashboard.html' : 'dashboard.html';
        return;
      }

      if (session) {
        window.location.href = role === 'companion' ? 'companion-dashboard.html' : 'dashboard.html';
      }
    });
  </script>
</body>

</html>
